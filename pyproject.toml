[project]
name = "customer-feedback-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasketch>=2.0.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
