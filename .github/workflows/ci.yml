name: Validate evidence and CPU runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.15"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python publication_check.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run python validate_ui.py --self-host
      - run: docker build -t cfi:test .
      - run: |
          docker run -d --name cfi -p 8081:8080 cfi:test
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:8081/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8081/health
          curl --fail 'http://localhost:8081/api/predict?example=mortgage'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-verification
          path: work/ui/
